services:
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    environment:
      POSTGRES_USER: smartmeter
      POSTGRES_PASSWORD: smartmeter
      POSTGRES_DB: metrics
    ports:
      - "5432:5432"
    volumes:
      - tsdb_data:/var/lib/postgresql/data

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - timescaledb
      - mosquitto
    env_file:
      - ../.env

volumes:
  tsdb_data: